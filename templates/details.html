{% extends "base.html" %}

{% block title %}Flakes | Search{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Search Results</h1>
    <div class="filter-container">
        <input type="text" id="global-search" class="search-box" placeholder="Search movies and series...">
    </div>
</div>

<div class="movies-grid" id="search-results"></div>

<script>
const searchInput = document.getElementById('global-search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', async () => {
    const query = searchInput.value.trim();
    if (!query) {
        searchResults.innerHTML = '';
        return;
    }

    const url = `/api/movies?q=${encodeURIComponent(query)}`;
    const response = await fetch(url);
    const data = await response.json();

    if (!data.length) {
        searchResults.innerHTML = '<p class="empty-state">No movies found</p>';
        return;
    }

    searchResults.innerHTML = data.map(movie => `
        <div class="movie-card">
            <img src="${movie.image_url}" alt="${movie.title}">
            <div class="movie-card-overlay">
                <div class="movie-card-title">${movie.title}</div>
                <div class="movie-card-rating">⭐ ${movie.rating}</div>
                <a href="/movie/${movie.id}" class="movie-card-button">View Details</a>
            </div>
        </div>
    `).join('');
});
</script>
{% endblock %}
