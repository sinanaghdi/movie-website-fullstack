<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flakes{% endblock %}</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo-container">
                <a href="/" class="logo-link"><h1 class="logo">flakes</h1></a>
            </div>
            <div class="menu-container">
                <ul class="menu-list">
                    <li class="menu-list-item {% if request.url.path == '/' %}active{% endif %}"><a href="/">Home</a></li>
                    <li class="menu-list-item {% if request.url.path == '/movies' %}active{% endif %}"><a href="/movies">Movies</a></li>
                    <li class="menu-list-item {% if request.url.path == '/series' %}active{% endif %}"><a href="/series">Series</a></li>
                    <li class="menu-list-item {% if request.url.path == '/popular' %}active{% endif %}"><a href="/popular">Popular</a></li>
                    <li class="menu-list-item {% if request.url.path == '/trends' %}active{% endif %}"><a href="/trends">Trends</a></li>
                </ul>
            </div>
            <div class="profile-container">
                <img class="profile-picture" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="Profile">
                <div class="profile-text-container">
                    <span class="profile-text">Profile</span>
                    <i class="fas fa-caret-down"></i>
                </div>
                <div class="toggle">
                    <i class="fas fa-moon toggle-icon"></i>
                    <i class="fas fa-sun toggle-icon"></i>
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <a href="/search"><i class="left-menu-icon fas fa-search"></i></a>
        <a href="/"><i class="left-menu-icon fas fa-home"></i></a>
        <a href="/popular"><i class="left-menu-icon fas fa-users"></i></a>
        <a href="/movies"><i class="left-menu-icon fas fa-bookmark"></i></a>
        <a href="/series"><i class="left-menu-icon fas fa-tv"></i></a>
        <a href="/trends"><i class="left-menu-icon fas fa-hourglass-start"></i></a>
    </div>

    <div class="container">
        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
