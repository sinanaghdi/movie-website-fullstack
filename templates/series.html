{% extends "base.html" %}

{% block title %}Flakes | Movies{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">All Movies</h1>
    <div class="filter-container">
        <input type="text" id="movie-search" class="search-box" placeholder="Search movies...">
        <select id="movie-genre" class="genre-filter">
            <option value="">All Genres</option>
            <option value="action">Action</option>
            <option value="drama">Drama</option>
            <option value="sci-fi">Sci-Fi</option>
        </select>
    </div>
</div>

<div class="movies-grid" id="movies-grid">
    {% for movie in movies %}
    <div class="movie-card">
        <img src="{{ movie.image_url }}" alt="{{ movie.title }}">
        <div class="movie-card-overlay">
            <div class="movie-card-title">{{ movie.title }}</div>
            <div class="movie-card-rating">⭐ {{ movie.rating }}</div>
            <a href="/movie/{{ movie.id }}" class="movie-card-button">View Details</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
